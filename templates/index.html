<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ONVIF PTZ Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: #f0f2f5; }
    .shadow-card { box-shadow: 0 0 15px rgba(0,0,0,0.15); }
    .control-card .card-header { background: #007bff; color: #fff; }
    .events-card .card-header { background: #ffc107; color: #212529; }
    .main-container { height: calc(100vh - 56px - 56px); }
    .left-col, .right-col { height: 100%; }
    .left-col { display: flex; flex-direction: column; }
    .events-card { height: 100%; display: flex; flex-direction: column; }
    .events-card .card-body { flex: 1; overflow-y: auto; padding: 0.5rem; }
    footer { font-size: 0.9rem; color: #777; height: 56px; line-height: 56px; margin: 0; }
    .ptz-btn { width: 36px; height: 36px; font-size: 1rem; padding: 0; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-0" style="height:56px;">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="fas fa-video me-2"></i>ONVIF PTZ Control</span>
    </div>
  </nav>

  <div class="container-fluid main-container px-2">
    <div class="row gx-2 h-100">
      <!-- Left: Video & PTZ -->
      <div class="col-lg-8 left-col">
        <!-- Video (fixed flex 45%) -->
        <div class="card shadow-card" style="flex: 0 0 65%; margin-bottom:0;">
          <div style="position:relative; height:100%; ">
            <img
              src="{{ url_for('video_feed') }}"
              alt="Live feed"
              style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:fill;"
            />
          </div>
        </div>
        <!-- PTZ Controls (fixed flex 35%) -->
        <div class="card control-card shadow-card d-flex" style="flex: 0 0 35%;">
          <div class="card-header w-100"><i class="fas fa-tools me-2"></i>PTZ Controls</div>
          <div class="card-body p-2 d-flex w-100">
            <!-- Pan/Tilt column -->
            <div class="flex-fill d-flex flex-column align-items-center justify-content-center">
              <button class="btn btn-outline-primary ptz-btn mb-2" onclick="ptz('up')">
                <i class="fas fa-arrow-up"></i>
              </button>
              <div class="d-flex mb-2">
                <button class="btn btn-outline-primary ptz-btn" onclick="ptz('left')">
                  <i class="fas fa-arrow-left"></i>
                </button>
                <button class="btn btn-outline-danger ptz-btn mx-2" onclick="ptz('stop')">
                  <i class="fas fa-stop"></i>
                </button>
                <button class="btn btn-outline-primary ptz-btn" onclick="ptz('right')">
                  <i class="fas fa-arrow-right"></i>
                </button>
              </div>
              <button class="btn btn-outline-primary ptz-btn" onclick="ptz('down')">
                <i class="fas fa-arrow-down"></i>
              </button>
            </div>
            <!-- Zoom column -->
            <div class="d-flex flex-column align-items-center justify-content-center ms-3">
              <button class="btn btn-outline-success ptz-btn mb-2" onclick="ptz('zoomin')">
                <i class="fas fa-search-plus"></i>
              </button>
              <button class="btn btn-outline-success ptz-btn" onclick="ptz('zoomout')">
                <i class="fas fa-search-minus"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right: Events -->
      <div class="col-lg-4 right-col">
        <div class="card events-card shadow-card h-100">
          <div class="card-header"><i class="fas fa-list me-2"></i>Events</div>
          <div class="card-body p-2">
            <div id="events"><p class="text-muted mb-0">Loading events…</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function ptz(action) {
      fetch('/ptz', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action}) });
    }
    async function loadEvents() {
      const resp = await fetch('/events?ts='+Date.now()); let data = await resp.json(); data.reverse();
      const c = document.getElementById('events'); if (!data.length) { c.innerHTML='<p class="text-muted mb-0">No recent events.</p>'; return; }
      let html = '<table class="table table-sm mb-0"><thead><tr><th>Time</th><th>Event Type</th><th>ObjectId</th><th>Status</th></tr></thead><tbody>';
      data.forEach(e => html+=`<tr><td>${e.time}</td><td>${e.event_type}</td><td>${e.object_id||'—'}</td><td>${e.status||''}</td></tr>`);
      html += '</tbody></table>'; c.innerHTML = html;
    }
    loadEvents(); setInterval(loadEvents,5000);
  </script>
</body>
</html>
